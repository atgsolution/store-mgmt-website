services:
  website:
    build:
      context: .
    container_name: store-mgmt-website
    restart: unless-stopped
    ports:
      - "${STORE_MGMT_WEBSITE_PORT:-6087}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
